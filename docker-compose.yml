version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meta_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kpilotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kpilotdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: meta_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:password123@db:5432/kpilotdb
      META_ACCESS_TOKEN: EAAkZCvUyXja0BSsWWSaX52lDbLUzThBZBC4dQdSXGp2TEB07dZB8Yp3a7VD3YAbH03vxNxvZAxd95XSfZB49kmiNzDqZCM53dpu2LBCDIPyWyeZAZAJRDcsQ4GYmchbp6ZBfHduDE4jbQYiDfy5npnDZAPiogy8xMrPgpQT8s6f7bNLjKATzOEZBJKgWacXcqFHRHf4NKzO1WZBk
      FB_APP_ID: 2603357056765357
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: meta_frontend
    ports:
      - "3000:80"  # Frontend server par Port 3000 par chalega
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
