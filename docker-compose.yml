version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meta_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kpilotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: meta_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/kpilotdb
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: meta_frontend
    ports:
      - "3000:80"  # Frontend server par Port 3000 par chalega
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
