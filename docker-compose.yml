

services:
  db:
    image: postgres:15-alpine
    container_name: meta_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: kpilotdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kpilotdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: meta_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://admin:password123@db:5432/kpilotdb
      META_ACCESS_TOKEN: EAAWyLUlhTwQBS1Mp9XIDSGcgfGYbaqpENLUDZCqBCd81svZAJ6LGDT9XCT8clDvV8A5WwMXXxbK84F5ddoUSlqYhkXjrfrHExxPCZCgQSdA8W1GSGatggqzIkpziKVO7klsP87gABaxz40DfGYOhdkPtFDU9tFgbq7W4uB0Ca7wVhKTCVGqUNznQvbmKWHxcsG5mhDX
      FB_APP_ID: 1603282457939716
      FB_APP_SECRET: YOUR_APP_SECRET_HERE
      FRONTEND_URL: https://adds.proteinsolution.in
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: meta_frontend
    ports:
      - "3000:80"  # Frontend server par Port 3000 par chalega
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
